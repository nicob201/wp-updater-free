services:
  app:
    build: .
    init: true   # reaps the update runner, which runs detached from the bridge
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WPU_PORT:-8787}:8787"   # this computer only, never the network
    environment:
      WPU_PUBLIC_PORT: ${WPU_PORT:-8787}     # the port the browser uses, for the Host and Origin checks
    volumes:
      - ./data:/app/data
      - ssh:/ssh

  # A fake server with outdated WordPress sites, to try the tool safely. In Settings: host demo, port 22, user demo.
  # Start: docker compose --profile demo up -d · Reset: docker compose --profile demo up -d --force-recreate demo
  demo:
    build: demo
    profiles: [demo]
    volumes:
      - ssh:/ssh:ro   # trusts only the app's key
    networks:
      default:
        aliases: [site1.demo, site2.demo, site3.demo]   # the app checks each site at its address after updating

volumes:
  ssh: {}
